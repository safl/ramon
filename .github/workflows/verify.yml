name: verify

# The release job requires a successful run of this workflow on the head of
# the pull request that bumps the version
on:
  pull_request:
  push:
    branches:
    - "main"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # A release pull request must bump completely and hold all of its base, as
  # the release is made only from the tree these checks ran on
  release-ready:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
    - name: Grab source
      uses: actions/checkout@v5.0.1

    - name: Require that a release pull request is complete and holds all of its base
      uses: refenv/gha-project-auto-release/ready@v1
      with:
        version-file: pyproject.toml
        version-pattern: '^version = "([^"]+)"$'

  format:
    runs-on: ubuntu-24.04
    steps:
    - name: Grab source
      uses: actions/checkout@v5.0.1

    - name: Install pre-commit
      run: pipx install pre-commit

    - name: Run pre-commit
      run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-24.04
    steps:
    - name: Grab source
      uses: actions/checkout@v5.0.1

    - name: Install uv
      run: pipx install uv==0.11.17

    - name: Run the tests
      run: uv run --locked pytest -v

    - name: Run ramon the way the README says, with uvx
      run: |
        expected="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
        actual="$(uvx --from . ramon --version)"
        [ "$actual" = "$expected" ]
